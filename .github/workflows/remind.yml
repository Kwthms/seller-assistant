name: Hatırlatma
on:
  schedule:
    - cron: "15 7 * * *"   # 10:15 Türkiye
    - cron: "35 7 * * *"   # 10:35 tekrar
    - cron: "59 19 * * *"  # 22:59 Türkiye
    - cron: "20 20 * * *"  # 23:20 tekrar
  workflow_dispatch:
    inputs:
      kind:
        description: "reminder, resend veya test"
        default: test
permissions:
  contents: write
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix scripts
      - name: Bildirim gönder
        env:
          PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
        run: |
          KIND="${{ github.event.inputs.kind }}"
          case "${{ github.event.schedule }}" in
            "35 7 * * *"|"20 20 * * *") KIND=resend ;;
            "") ;;
            *) KIND=reminder ;;
          esac
          node scripts/send.mjs "${KIND:-reminder}"
      # GitHub pauses scheduled jobs in repos with no commits for 60 days; keep it alive.
      - name: Zamanlayıcıyı canlı tut
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45*86400 )) ]; then
            date -u > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git add .keepalive && git commit -m "keepalive" && git push
          fi
